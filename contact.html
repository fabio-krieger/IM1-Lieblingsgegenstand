<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!--
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="img/icon-karabiner.svg">

    <title>Kontakt | Karabiner</title>
</head>
<body dataset-theme="dark">
    <header>
        <section class="header-section">
            <div class="header-title">
                03 - Kontakt
            </div>
            <nav class="mainnav">
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="aboutme.html">Über mich</a>
                    </li>
                    <li>
                        <a href="contact.html" class="active">Kontakt</a>
                    </li>
                </ul>
            </nav>
        </section>
    </header>
    <main>
        <section class="main-section">
            <h1>Schreib mir</h1>
        </section>
        <section class="main-section">
            <div class="grid-wrapper">
                <p class="text">
                    Eine Frage, ein Gedanke oder eine Idee?<br>
                    Ich freue mich auf deine Nachricht.
                </p>
                <div>
                    <form>
                        <div class="form-flex">
                            <div class="formfield-wrapper">
                                <label class="smalltext" for="name">Dein Name</label>
                                <input type="text" name="name" id="name" placeholder="Wie heisst du?" required>
                            </div>
                            <div class="formfield-wrapper">
                                <label class="smalltext" for="mail">Deine Email</label>
                                <input type="email" name="mail" id="mail" placeholder="name@beispiel.ch" required>
                            </div>
                        </div>
                        <div class="form-flex">
                            <div class="formfield-wrapper">
                                <label class="smalltext" for="message">Deine Nachricht</label>
                                <textarea name="message" id="message" placeholder="Was möchtest du mir mitteilen?" required></textarea>
                            </div>
                        </div>
                        <div class="form-flex">
                            <div class="formfield-wrapper">
                                <input type="submit" value="Abschicken">
                            </div>
                        </div>
                        <div class="form-flex">
                            <div class="formfield-wrapper">
                                <p>Deine Angaben werden nur für die Beantwortung deiner Nachricht verwendet.</p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <section class="footer-section">
            <button id="theme-toggle">
                <img src="img/icon-darkmode.svg" alt="theme-icon">
                <span>Dunkel</span>
            </button>
            <a href="impressum.html">Impressum</a>
        </section>
    </footer>
    <script src="js/theme-toggle.js"></script>
</body>
</html>
